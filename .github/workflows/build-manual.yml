on:
  workflow_dispatch:
    inputs:
      use_clang:
        description: 'Build with Clang instead of the platform default compiler (gcc on Linux, MSVC on Windows). Skia is significantly faster when built with Clang.'
        type: boolean
        default: false

permissions:
  contents: read

env:
  version: m143-da51f0d60e-4

jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target_machine: ["x64", "arm64"]
        build_type: [Release, Debug]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: abdes/gha-setup-ninja@660f330a40aefa8d11632b3f901e92a4adb33d65
      - run: sudo ./script/prepare_linux.sh
      - run: |
          sudo apt-get update
          sudo apt-get --yes install g++-9-aarch64-linux-gnu
        if: ${{ matrix.target_machine == 'arm64' }}
      - run: PATH=/usr/lib/binutils-2.26/bin:$PATH python3 script/checkout.py --version ${{ env.version }}
      - run: PATH=/usr/lib/binutils-2.26/bin:$PATH python3 script/build.py --build-type ${{ matrix.build_type }} --machine ${{ matrix.target_machine }} --use-clang ${{ inputs.use_clang }}
      - run: PATH=/usr/lib/binutils-2.26/bin:$PATH python3 script/archive.py --version ${{ env.version }} --build-type ${{ matrix.build_type }} --machine ${{ matrix.target_machine }} --classifier "${{ inputs.use_clang && 'clang' || '' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Skia-${{ env.version }}-linux-${{ matrix.build_type }}-${{ matrix.target_machine }}${{ inputs.use_clang && '-clang' || '' }}.zip
          path: '*.zip'

  windows:
    strategy:
      matrix:
        os: [ windows-latest, windows-11-arm ]
        build_type: [ Release, Debug ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: |
          ninja --version
          $os_arch = "${{ runner.arch }}".ToLower()
          echo "os_arch=$os_arch" >> $env:GITHUB_ENV
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: ${{ env.os_arch }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ env.os_arch }}
      - shell: bash
        run: python3 script/checkout.py --version ${{ env.version }}
      - shell: bash
        run: python3 script/build.py --build-type ${{ matrix.build_type }} --use-clang ${{ inputs.use_clang }}
      - shell: bash
        run: python3 script/archive.py --version ${{ env.version }} --build-type ${{ matrix.build_type }} --classifier "${{ inputs.use_clang && 'clang' || '' }}"
      - uses: actions/upload-artifact@v7
        with:
          name: Skia-${{ env.version }}-windows-${{ matrix.build_type }}-${{ env.os_arch }}${{ inputs.use_clang && '-clang' || '' }}.zip
          path: '*.zip'
